<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>트렌드림 컨트롤러 컨트롤 [TEST]</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
:root {
  --bg: #F5F5F5;
  --card: #FFFFFF;
  --text-primary: #1A1A1A;
  --text-secondary: #8C8C8C;
  --text-tertiary: #B0B0B0;
  --accent: #191919;
  --accent-hover: #000000;
  --success: #05ac36;
  --success-bg: rgba(5,172,54,0.1);
  --error: #CF3030;
  --error-bg: #FFF0F0;
  --loading-bg: rgba(10,115,220,0.1);
  --loading-text: #0a73dc;
  --border: rgba(0,0,0,0.08);
  --input-bg: #f7f7f7;
  --radius: 14px;
  --radius-sm: 12px;
  --radius-xs: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  min-height: 100dvh;
  padding: 16px;
  padding-top: max(16px, env(safe-area-inset-top));
  padding-bottom: max(32px, env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 440px; margin: 0 auto; }

/* Header */
.header { padding: 20px 4px 24px; }
.header h1 {
  font-size: 26px;
  font-weight: 650;
  letter-spacing: -0.5px;
  color: var(--text-primary);
  line-height: 1.2;
}
.header .subtitle {
  font-size: 14px;
  font-weight: 420;
  color: #767676;
  margin-top: 6px;
  letter-spacing: -0.1px;
}

/* Cards */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 12px;
  box-shadow: 0px 0.5px 4px rgba(0,0,0,0.02);
}
.card-title {
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -0.1px;
  color: #191919;
  margin-bottom: 16px;
}

/* Buttons */
.btn {
  width: 100%;
  padding: 14px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  letter-spacing: -0.1px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:active { background: var(--accent-hover); transform: scale(0.985); }
.btn-secondary {
  background: var(--input-bg);
  color: var(--text-primary);
  border: 1px solid var(--border);
}
.btn-secondary:active { background: #F0EFEC; transform: scale(0.985); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }
.btn-loading  { background: rgba(10,115,220,0.1) !important; color: #0a73dc !important; border: 1px solid #0a73dc !important; opacity: 1 !important; }
.btn-complete { background: rgba(5,172,54,0.1) !important; color: #05ac36 !important; border: 1px solid #05ac36 !important; opacity: 1 !important; }

/* Inputs */
label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
  letter-spacing: 0.1px;
}
input, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: var(--radius-xs);
  font-family: inherit;
  font-size: 14px;
  font-weight: 450;
  background: var(--input-bg);
  color: var(--text-primary);
  transition: all 0.15s ease;
  -webkit-appearance: none;
  height: 46px;
}
input:focus, textarea:focus { outline: none; border-color: rgba(0,0,0,0.08); box-shadow: none; }
input[type="date"] { min-height: 46px; }
.date-wrapper { position: relative; }
.date-placeholder {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #191919;
  pointer-events: none;
  font-size: 14px;
  line-height: 1;
}
input[type="date"]::-webkit-calendar-picker-indicator {
  opacity: 0;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  cursor: pointer;
}
.date-icon {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  display: flex;
  align-items: center;
}
input[type="date"]:not(.has-value)::-webkit-datetime-edit-text,
input[type="date"]:not(.has-value)::-webkit-datetime-edit-month-field,
input[type="date"]:not(.has-value)::-webkit-datetime-edit-day-field,
input[type="date"]:not(.has-value)::-webkit-datetime-edit-year-field { color: transparent; }
input::placeholder { color: #767676; font-weight: 400; }
input:focus, textarea:focus {
  outline: none;
  border-color: rgba(0,0,0,0.08);
  background: var(--input-bg);
  box-shadow: none;
}
.input-group { margin-bottom: 14px; }
.input-row { display: flex; gap: 10px; }
.input-row .input-group { flex: 1; margin-bottom: 0; }

/* Status */
.status {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: var(--radius-xs);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.5;
  display: none;
  letter-spacing: -0.1px;
}
.status.success { display: block; background: var(--success-bg); color: var(--success); border: 1px solid rgba(5,172,54,0.2); }
.status.error   { display: block; background: var(--error-bg);   color: var(--error);   border: 1px solid rgba(207,48,48,0.08); }
.status.loading { display: block; background: var(--loading-bg); color: var(--loading-text); border: 1px solid rgba(10,115,220,0.2); }

/* List rows (기사 교체 / 썸네일 교체 공통) */
.replace-item,
.thumb-item {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.replace-item .num,
.thumb-item .num {
  width: 52px;
  text-align: center;
  flex-shrink: 0;
  padding: 12px 8px;
}
.replace-item .url-input { flex: 1; }

.reorder-item {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.reorder-item .reorder-from,
.reorder-item .reorder-to {
  flex: 1;
  text-align: left;
  padding: 12px 12px;
}
.reorder-item .reorder-from.has-value,
.reorder-item .reorder-to.has-value {
  text-align: center;
}
.reorder-arrow {
  flex-shrink: 0;
  width: 20px;
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  color: #191919;
}

.add-btn {
  font-size: 15px;
  color: var(--accent);
  background: none;
  border: none;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  padding: 0;
  margin: 16px 0;
  transition: opacity 0.15s;
  display: block;
  width: 100%;
  text-align: center;
}
.add-btn:active { opacity: 0.6; }

/* Divider */
.divider { height: 1px; background: var(--border); margin: 14px 0; }

/* Setup card */
.setup-card { border: none; box-shadow: none; }

/* Connected button */
.btn-connected {
  width: 100%;
  padding: 14px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  background: var(--success-bg);
  color: var(--success);
  cursor: default;
  letter-spacing: -0.1px;
}

/* Shortcut buttons */
.shortcut-stack { display: flex; flex-direction: column; gap: 8px; }
.shortcut-stack .btn-secondary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-align: left;
}
.shortcut-stack .btn-secondary .arrow {
  font-size: 14px;
  color: #767676;
  transition: transform 0.15s;
}
.shortcut-stack .btn-secondary:active .arrow { transform: translateX(2px); }

/* ── Figma 파일 인풋 (node 6387:3634 기준) ── */
.file-input-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--input-bg);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: var(--radius-xs);
  padding: 10px 10px 10px 12px;
  overflow: hidden;
  cursor: pointer;
}
.file-name-text {
  font-family: 'Pretendard', sans-serif;
  font-size: 12px;
  font-weight: 400;
  color: #b0b0b0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
  line-height: 1;
}
.file-name-text.has-file { color: #191919; }
.file-select-btn {
  background: rgba(0,0,0,0.08);
  border: none;
  border-radius: 6px;
  padding: 7px 8px;
  font-family: 'Pretendard', sans-serif;
  font-size: 12px;
  font-weight: 400;
  color: #191919;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  margin-left: 8px;
  line-height: 1;
  transition: background 0.15s;
}
.file-select-btn:active { background: rgba(0,0,0,0.14); }

/* Footer */
.footer {
  text-align: center;
  padding: 20px 0 8px;
  font-size: 11px;
  font-weight: 450;
  color: #767676;
  letter-spacing: 0.2px;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>트렌드림 컨트롤러</h1>
    <p class="subtitle" style="color:#CF3030;">🧪 테스트 모드 — test/ 폴더에서 동작합니다</p>
  </div>

  <!-- 새 큐레이션 -->
  <div class="card">
    <div class="card-title">새 큐레이션</div>
    <div class="input-group">
      <label>기사 개수</label>

    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;font-weight:450;">수정 내용을 자연어로 입력하세요. 완료되면 카카오워크로 알림이 와요.</p>
    <textarea id="commandPrompt" rows="3" placeholder="프롬프트를 입력하여 수정하세요." autocorrect="off" autocapitalize="off" spellcheck="false" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid rgba(0,0,0,0.08);border-radius:var(--radius-xs);font-size:14px;font-family:inherit;resize:none;overflow:hidden;background:var(--input-bg);color:var(--text-primary);outline:none;"></textarea>
    <button class="btn btn-primary" id="commandBtn" onclick="runCommand()" style="margin-top:10px;">실행</button>

  </div>

  <!-- 기사 교체 -->

    <div class="card-title">기사 교체</div>

<script>
let settings = { token: '', owner: 'Leche', repo: 'trend-articles' };

// ── URL 해시로 설정 파싱 ──
function parseHash() {
  const hash = window.location.hash.substring(1);
  if (!hash) return null;
  const params = {};
  hash.split('&').forEach(pair => {
    const [k, v] = pair.split('=');
    if (k && v) params[decodeURIComponent(k)] = decodeURIComponent(v);
  });
  return params;
}

function showConnected() {
  document.getElementById('saveBtn').style.display = 'none';
  document.getElementById('connectedBtn').style.display = 'block';
  document.getElementById('setupCard').classList.add('saved');
  document.getElementById('tokenStatus').innerHTML = '';
}

// ── 날짜 placeholder 토글 ──
function toggleDatePlaceholder(input) {
  const ph = document.getElementById('datePlaceholder');
  if (input.value) {
    input.classList.add('has-value');
    if (ph) ph.style.display = 'none';
  } else {
    input.classList.remove('has-value');
    if (ph) ph.style.display = '';
  }
}

// ── 테스트 모드: 날짜 대신 "test" 고정 경로 사용 ──
function getTodayKST() {
  return 'test';
}

// ── 파일 인풋 트리거 ──
function triggerFileInput(wrapper) {
  wrapper.querySelector('input[type="file"]').click();
}

// ── 썸네일 파일 선택 시 파일명 업데이트 ──
function onThumbFileChange(input) {
  const wrapper  = input.closest('.file-input-wrapper');
  const nameSpan = wrapper.querySelector('.file-name-text');
  if (input.files && input.files[0]) {
    nameSpan.textContent = input.files[0].name;
    nameSpan.classList.add('has-file');
  } else {
    nameSpan.textContent = '선택된 파일 없음';
    nameSpan.classList.remove('has-file');
  }
}

// ── 썸네일 항목 추가 ──
function addThumbRow() {
  const list = document.getElementById('thumbList');
  const div  = document.createElement('div');
  div.className = 'thumb-item';
  div.innerHTML = `
    <input class="num" type="number" placeholder="#" min="1" max="12">
    <div class="file-input-wrapper" onclick="triggerFileInput(this)">
      <span class="file-name-text">선택된 파일 없음</span>
      <button type="button" class="file-select-btn" onclick="event.stopPropagation();triggerFileInput(this.closest('.file-input-wrapper'))">파일 선택</button>
      <input type="file" accept="image/*,video/mp4" style="display:none" onchange="onThumbFileChange(this)">
    </div>`;
  list.appendChild(div);
}

// ── GitHub 파일 읽기/쓰기 유틸 ──
async function ghGet(path) {
  const res = await fetch(`https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${path}`, {
    headers: {
      'Authorization': `Bearer ${settings.token}`,
      'Accept': 'application/vnd.github.v3+json'
    }
  });
  if (!res.ok) throw new Error(`파일 읽기 실패 (${res.status}): ${path}`);
  const fd = await res.json();
  // 1 MB 초과 파일은 content가 빈 문자열 → Git Blob API로 재시도
  if (!fd.content || fd.encoding === 'none') {
    const blobRes = await fetch(`https://api.github.com/repos/${settings.owner}/${settings.repo}/git/blobs/${fd.sha}`, {
      headers: {
        'Authorization': `Bearer ${settings.token}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });
    if (!blobRes.ok) throw new Error(`블롭 읽기 실패 (${blobRes.status}): ${path}`);
    const blob = await blobRes.json();
    fd.content = blob.content;
    fd.encoding = blob.encoding;
  }
  return fd;
}

async function ghPut(path, newContent, sha, message) {
  const res = await fetch(`https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${path}`, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${settings.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(newContent))), sha })
  });
  if (!res.ok) {
    const d = await res.json();
    throw new Error(d.message || res.statusText);
  }
  return res.json();
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload  = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// ── image-frame 교체 (div depth 방식) ──
function replaceImageFrame(content, articleNum, dataUrl) {
  const numStr   = String(articleNum).padStart(2, '0');
  const labelIdx = content.indexOf(`ARTICLE ${numStr}`);
  if (labelIdx === -1) throw new Error(`기사 ${articleNum}번을 찾을 수 없어요.`);
  const marker     = '<div class="image-frame">';
  const frameStart = content.indexOf(marker, labelIdx);
  if (frameStart === -1) throw new Error('이미지 영역을 찾을 수 없어요.');
  let depth = 1, pos = frameStart + marker.length;
  while (depth > 0 && pos < content.length) {
    const nextOpen  = content.indexOf('<div', pos);
    const nextClose = content.indexOf('</div>', pos);
    if (nextClose === -1) break;
    if (nextOpen !== -1 && nextOpen < nextClose) { depth++; pos = nextOpen + 4; }
    else { depth--; pos = nextClose + 6; }
  }
  const newFrame = `<div class="image-frame"><img class="article-image" src="${dataUrl}" alt="썸네일"></div>`;
  return content.substring(0, frameStart) + newFrame + content.substring(pos);
}

// ── 썸네일 교체 (다수 기사 대응) ──
async function replaceThumbnails() {
  if (!checkSettings()) return;

  // 항목 수집
  const items = document.querySelectorAll('.thumb-item');
  const tasks = [];
  items.forEach(item => {
    const num  = parseInt(item.querySelector('.num').value);
    const file = item.querySelector('input[type="file"]').files[0];
    if (num && file) tasks.push({ num, file });
  });

  if (tasks.length === 0) {
    showStatus('replaceThumbStatus', 'error', '기사 번호와 이미지 파일을 입력해주세요.');
    return;
  }

  showStatus('replaceThumbStatus', 'loading', '이미지 변환 중...');

  try {
    // 모든 파일 먼저 dataUrl 변환
    const converted = await Promise.all(tasks.map(async t => ({
      num:    t.num,
      dataUrl: await fileToDataUrl(t.file)
    })));

    const dateVal = getTodayKST();
    const nums    = converted.map(t => t.num).join(', ');
    const msg     = `🖼️ 썸네일 교체: ${nums}번 기사 (${dateVal})`;

    async function applyToPath(path) {
      const fd   = await ghGet(path);
      let html   = new TextDecoder().decode(Uint8Array.from(atob(fd.content.replace(/\s/g, '')), c => c.charCodeAt(0)));
      for (const { num, dataUrl } of converted) {
        html = replaceImageFrame(html, num, dataUrl);
      }
      await ghPut(path, html, fd.sha, msg);
    }

    showStatus('replaceThumbStatus', 'loading', '날짜 폴더 파일 업데이트 중...');
    await applyToPath(`${dateVal}/index.html`);

    try {
      showStatus('replaceThumbStatus', 'loading', 'index.html 업데이트 중...');
      await applyToPath('index.html');
    } catch(_) {}

    showStatus('replaceThumbStatus', 'success', `${nums}번 기사 썸네일 교체 완료! 1~2분 후 반영돼요.`);

    // 파일 인풋 초기화
    document.querySelectorAll('.thumb-item input[type="file"]').forEach(f => { f.value = ''; });
    document.querySelectorAll('.thumb-item .file-name-text').forEach(s => {
      s.textContent = '선택된 파일 없음';
      s.classList.remove('has-file');
    });
  } catch(e) {
    showStatus('replaceThumbStatus', 'error', '오류: ' + e.message);
  }
}

// ── 기사 순서 조정 (다수 from→to, 오늘 날짜 자동, 번호 재부여) ──
async function reorderArticles() {
  if (!checkSettings()) return;

  // 항목 수집
  const moves = [];
  document.querySelectorAll('.reorder-item').forEach(item => {
    const from = parseInt(item.querySelector('.reorder-from').value);
    const to   = parseInt(item.querySelector('.reorder-to').value);
    if (from && to && from !== to) moves.push({ from, to });
  });

  if (moves.length === 0) {
    showStatus('reorderStatus', 'error', '이동할 기사 번호와 위치를 입력해주세요.');
    return;
  }

  showStatus('reorderStatus', 'loading', '파일 읽는 중...');

  try {
    const dateVal = getTodayKST();
    const moveSummary = moves.map(m => `${m.from}→${m.to}`).join(', ');
    const msg     = `🔀 기사 순서 조정 (${dateVal}): ${moveSummary}`;

    async function reorderHtml(path) {
      const fd   = await ghGet(path);
      let html   = new TextDecoder().decode(Uint8Array.from(atob(fd.content.replace(/\s/g, '')), c => c.charCodeAt(0)));

      // article 블록 추출
      const startTag = '<article class="article-item">';
      const endTag   = '</article>';
      const blocks   = [];
      let cursor     = 0;
      while (true) {
        const s = html.indexOf(startTag, cursor);
        if (s === -1) break;
        const e = html.indexOf(endTag, s) + endTag.length;
        blocks.push(html.substring(s, e));
        cursor = e;
      }
      if (blocks.length === 0) throw new Error('기사 블록을 찾을 수 없어요.');

      // 이동 순차 적용 (각 이동마다 현재 blocks 배열 기준으로 처리)
      for (const { from, to } of moves) {
        if (from < 1 || from > blocks.length || to < 1 || to > blocks.length) {
          throw new Error(`기사 번호 범위 초과 (총 ${blocks.length}개 기사): ${from}→${to}`);
        }
        const moved = blocks.splice(from - 1, 1)[0];
        blocks.splice(to - 1, 0, moved);
      }

      // ARTICLE 번호 재부여 (새 위치 기준 01, 02, 03...)
      const renumbered = blocks.map((b, i) =>
        b.replace(/ARTICLE \d{2}/, `ARTICLE ${String(i + 1).padStart(2, '0')}`)
      );

      // article-wrap 교체
      const wrapStart = html.indexOf('<main class="article-wrap article-list">');
      const wrapEnd   = html.indexOf('</main>', wrapStart) + 7;
      const newHtml   =
        html.substring(0, wrapStart) +
        '<main class="article-wrap article-list"> ' +
        renumbered.join(' ') +
        ' </main>' +
        html.substring(wrapEnd);

      await ghPut(path, newHtml, fd.sha, msg);
    }

    showStatus('reorderStatus', 'loading', '날짜 폴더 파일 업데이트 중...');
    await reorderHtml(`${dateVal}/index.html`);

    try {
      showStatus('reorderStatus', 'loading', 'index.html 업데이트 중...');
      await reorderHtml('index.html');
    } catch(_) {}

    showStatus('reorderStatus', 'success', `순서 조정 완료! (${moveSummary}) 번호 자동 재부여됐어요. 1~2분 후 반영돼요.`);
    // 인풋 초기화
    document.querySelectorAll('.reorder-item input').forEach(i => { i.value = ''; });
  } catch(e) {
    showStatus('reorderStatus', 'error', '오류: ' + e.message);
  }
}

// ── 유틸 ──
function setBtnLoading(btn, loading) {
  btn.disabled = loading;
  btn.classList.toggle('btn-loading', loading);
  if (!loading) btn.classList.remove('btn-complete');
}
function setBtnComplete(btn) {
  btn.classList.remove('btn-loading');
  btn.classList.add('btn-complete');
  setTimeout(() => btn.classList.remove('btn-complete'), 2500);
}

function showStatus(id, type, msg) {
  const el = document.getElementById(id);
  el.className = `status ${type}`;
  el.textContent = msg;
  el.style.display = 'block';
}

// ── 설정 ──
function loadSettings() {
  const params = parseHash();
  if (params && params.token) {
    settings.token = params.token;
    settings.owner = params.owner || 'Leche';
    settings.repo  = params.repo  || 'trend-articles';
    document.getElementById('tokenInput').value = settings.token;
    document.getElementById('ownerInput').value = settings.owner;
    document.getElementById('repoInput').value  = settings.repo;
    showConnected();
  }
}

function saveSettings() {
  const token = document.getElementById('tokenInput').value.trim();
  const owner = document.getElementById('ownerInput').value.trim();
  const repo  = document.getElementById('repoInput').value.trim();
  if (!token || !owner || !repo) {
    document.getElementById('tokenStatus').innerHTML =
      '<div style="color:#d32f2f;font-size:13px;margin-top:6px;">모든 필드를 입력해주세요</div>';
    return;
  }
  settings = { token, owner, repo };
  window.location.hash =
    `token=${encodeURIComponent(token)}&owner=${encodeURIComponent(owner)}&repo=${encodeURIComponent(repo)}`;
  showConnected();
}

function checkSettings() {
  if (!settings.token || !settings.owner || !settings.repo) {
    alert('먼저 초기 설정을 완료해주세요!');
    return false;
  }
  return true;
}

// ── 새 큐레이션 ──
async function triggerWorkflow(inputs) {
  const url = `https://api.github.com/repos/${settings.owner}/${settings.repo}/actions/workflows/curate.yml/dispatches`;
  return fetch(url, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${settings.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ ref: 'main', inputs }),
  });
}

async function runCuration() {
  if (!checkSettings()) return;
  showStatus('runStatus', 'loading', '워크플로우 실행 요청 중...');
  try {
    const res = await triggerWorkflow({
      article_count: document.getElementById('articleCount').value || '6',
      custom_date:   document.getElementById('customDate').value || '',
      replace_urls:  '',
    });
    if (res.status === 204) {
      showStatus('runStatus', 'success', '워크플로우가 시작되었어요! 카카오워크로 완료 알림이 올 거예요.');
    } else {
      const data = await res.json();
      showStatus('runStatus', 'error', '오류: ' + (data.message || res.statusText));
    }
  } catch(e) {
    showStatus('runStatus', 'error', '네트워크 오류: ' + e.message);
  }
}

  if (!checkSettings()) return;
  const parts = [];

    } else {
      const data = await res.json();
      showStatus('replaceStatus', 'error', '오류: ' + (data.message || res.statusText));
    }
  } catch(e) {
    showStatus('replaceStatus', 'error', '네트워크 오류: ' + e.message);
  }

async function runCommand() {

  if (!prompt) {

    return;

  showStatus('commandStatus', 'loading', '명령 전달 중...');

    const res = await fetch(
      `https://api.github.com/repos/${settings.owner}/${settings.repo}/actions/workflows/command.yml/dispatches`,
      {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${settings.token}`,
          'Accept': 'application/vnd.github.v3+json',

    showStatus('commandStatus', 'error', '네트워크 오류: ' + e.message);

function addLinkFixRow() {
  const list = document.getElementById('linkFixList');
  const div = document.createElement('div');
  div.className = 'replace-item';
  div.innerHTML = '<input class="num" type="number" placeholder="#" min="1" max="12"><input class="url-input" type="text" placeholder="https://..." value="" autocorrect="off" autocapitalize="off" spellcheck="false">';
  list.appendChild(div);
}

function fixLinkInHtml(content, articleNum, newUrl) {
  const numStr = String(articleNum).padStart(2, '0');
  const labelIdx = content.indexOf(`ARTICLE ${numStr}`);
  if (labelIdx === -1) throw new Error(`기사 ${articleNum}번을 찾을 수 없어요.`);
  const linkClassIdx = content.indexOf('class="article-link"', labelIdx);
  if (linkClassIdx === -1) throw new Error('링크 영역을 찾을 수 없어요.');
  const aTagStart = content.lastIndexOf('<a', linkClassIdx);
  const aTagEnd = content.indexOf('</a>', linkClassIdx) + 4;
  const oldATag = content.substring(aTagStart, aTagEnd);
  const hrefMatch = oldATag.match(/href="([^"]+)"/);
  if (!hrefMatch) throw new Error('URL을 찾을 수 없어요.');
  const oldUrl = hrefMatch[1];
  const newATag = oldATag
    .replace(`href="${oldUrl}"`, `href="${newUrl}"`)
    .replace(`>${oldUrl}<`, `>${newUrl}<`);
  return content.substring(0, aTagStart) + newATag + content.substring(aTagEnd);
}

async function fixLinks() {
  if (!checkSettings()) return;
  const items = document.querySelectorAll('#linkFixList .replace-item');
  const tasks = [];
  items.forEach(item => {
    const num = parseInt(item.querySelector('.num').value);
    const url = item.querySelector('.url-input').value.trim();
    if (num && url) tasks.push({ num, url });
  });
  if (tasks.length === 0) {
    showStatus('linkFixStatus', 'error', '기사 번호와 새 URL을 입력해주세요.');
    return;
  }
  const nums = tasks.map(t => t.num).join(', ');
  showStatus('linkFixStatus', 'loading', 'HTML 파일 불러오는 중...');
  try {
    const dateVal = getTodayKST();
    const msg = `🔗 링크 수정: ${nums}번 기사 (${dateVal})`;
    async function applyToPath(path) {
      const fd = await ghGet(path);
      let html = new TextDecoder().decode(Uint8Array.from(atob(fd.content.replace(/\s/g, '')), c => c.charCodeAt(0)));
      for (const { num, url } of tasks) {
        html = fixLinkInHtml(html, num, url);
      }
      await ghPut(path, html, fd.sha, msg);
    }
    showStatus('linkFixStatus', 'loading', '날짜 폴더 파일 업데이트 중...');
    await applyToPath(`${dateVal}/index.html`);
    try {
      showStatus('linkFixStatus', 'loading', 'index.html 업데이트 중...');
      await applyToPath('index.html');
    } catch(_) {}
    showStatus('linkFixStatus', 'success', `${nums}번 기사 링크 수정 완료! 1~2분 후 반영돼요.`);
  } catch(e) {
    showStatus('linkFixStatus', 'error', '오류: ' + e.message);
  }
}
