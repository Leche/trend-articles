name: Notify Digest

# 알림 정책:
#  - 콘텐츠 결과물 변경(큐레이션·교체·썸네일·순서·링크·AI·발행)이 main 에 commit·push
#    되면 GitHub Pages 가 빌드를 돌린다. 그 빌드가 끝난 시점(=실제로 페이지가 새 내용을
#    서빙하기 시작한 시점)에 성공 알림 발사. commit 메시지 첫 글자(이모지)로 어떤 액션
#    이었는지 라벨 분류하고, 다이제스트 페이지 링크로 안내한다.
#  - 콘텐츠 워크플로우(큐레이션·AI·Agit)가 실패하면 push 가 일어나지 않아 위 경로로 못
#    잡히므로, 워크플로우 실패 자체로 별도 알림 (Actions 로그 링크).
on:
  workflow_dispatch:  # 웹훅 자가진단용 수동 실행 (webhook-selftest 잡만 동작)
  workflow_run:
    workflows:
      - pages-build-deployment
      - 트렌드림 기사 큐레이션
      - 트렌드림 AI 명령 실행
      - Agit 게시
    types:
      - completed

jobs:
  # 웹훅 자가진단 — 수동 실행 전용. 카웍이 실제로 메시지를 수락하는지만 확인한다.
  # 알림이 조용히 안 오는 상황에서 secret·봇·페이로드 중 어디가 깨졌는지 가르는 용도.
  webhook-selftest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Probe KakaoWork webhook
        env:
          KAKAOWORK_WEBHOOK_URL: ${{ secrets.KAKAOWORK_WEBHOOK_URL }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error

          def kw_accepted(body):
              """카웍 webhook 수락 여부. 정상 응답은 {"code": "ok"} (실측 2026-07-27)."""
              try:
                  parsed = json.loads(body or '{}')
              except json.JSONDecodeError:
                  return False
              return parsed.get('code') == 'ok' or parsed.get('success') is True

          webhook = os.environ.get('KAKAOWORK_WEBHOOK_URL', '').strip()
          if not webhook:
              print("[ERROR] KAKAOWORK_WEBHOOK_URL secret 비어있음")
              raise SystemExit(1)
          print(f"[INFO] webhook 길이={len(webhook)} 끝8자리=...{webhook[-8:]}")

          payload = {
              "text": "🔧 웹훅 자가진단",
              "blocks": [
                  {"type": "header", "text": "자가진단", "style": "blue"},
                  {"type": "text", "text": "트렌드림 알림 웹훅 점검용 메시지예요."},
              ],
          }
          req = urllib.request.Request(
              webhook, data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  status, body = resp.status, resp.read().decode("utf-8", errors="replace")
          except urllib.error.HTTPError as e:
              print(f"[HTTPError] {e.code} {e.reason} body={e.read().decode('utf-8', errors='replace')}")
              raise
          print(f"[RESULT] status={status} body={body}")
          if not kw_accepted(body):
              print("[ERROR] 카웍이 메시지를 거부했습니다 — 봇/웹훅 URL 상태 확인 필요")
              raise SystemExit(1)
          print("[OK] 웹훅 정상")
          PYEOF

  # Pages 빌드 성공 → 콘텐츠 알림 (commit 메시지 첫 글자 이모지로 라벨)
  # workflow_run.name 은 GitHub 표시 명에 따라 'pages-build-deployment' 또는
  # 'pages build and deployment' 둘 중 하나로 떨어질 수 있어 contains 로 잡는다.
  notify-on-deploy:
    if: |
      contains(github.event.workflow_run.name, 'pages') &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # main 최신 커밋을 본다. Pages 빌드의 workflow_run.head_sha 는 신뢰할 수 없다 —
      # 2026-07-26 22:05 큐레이션 푸시로 돈 빌드가 이틀 전(07-24) 커밋을 head_sha 로
      # 보고했고, 그 커밋엔 라벨 이모지가 없어 알림이 통째로 skip 됐다.
      # 알림은 배포 직후 1~2분 내에 도니 main tip 이 방금 배포된 내용과 사실상 같다.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Send KakaoWork notification
        env:
          KAKAOWORK_WEBHOOK_URL: ${{ secrets.KAKAOWORK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, subprocess, urllib.request, urllib.error

          def kw_accepted(body):
              """카웍 webhook 수락 여부. 정상 응답은 {"code": "ok"} (실측 2026-07-27)."""
              try:
                  parsed = json.loads(body or '{}')
              except json.JSONDecodeError:
                  return False
              return parsed.get('code') == 'ok' or parsed.get('success') is True

          webhook = os.environ.get('KAKAOWORK_WEBHOOK_URL', '').strip()
          if not webhook:
              print("[ERROR] KAKAOWORK_WEBHOOK_URL secret 비어있음")
              raise SystemExit(1)

          try:
              commit_msg = subprocess.check_output(
                  ['git', 'log', '-1', '--pretty=%s']
              ).decode('utf-8').strip()
          except Exception:
              commit_msg = ''

          # commit 첫 글자(이모지)로 라벨 결정. 매칭되지 않으면 알림 skip.
          # 📨 Agit 발행 알림은 agit-post.yml 안에서 직접 카웍 webhook 으로
          # CTA 버튼 포함해 발사하므로 여기 라벨에서 제외 (중복 방지).
          emoji_labels = [
              ('✨', '기사 큐레이션'),
              ('🔄', '기사 교체'),
              ('🖼️', '썸네일 교체'),
              ('🔀', '기사 순서 조정'),
              ('🔗', '링크 수정'),
              ('🤖', 'AI 명령 실행'),
          ]
          label = None
          for emoji, action_name in emoji_labels:
              if commit_msg.startswith(emoji):
                  label = action_name
                  break

          if not label:
              print(f"[INFO] commit '{commit_msg[:60]}' 에 알림 대상 이모지 없음 — skip")
              raise SystemExit(0)

          # 가장 최신 YYYY-MM-DD 폴더 = 작업 대상 다이제스트 페이지
          repo = os.environ.get('GITHUB_REPOSITORY', 'Leche/trend-articles')
          owner, repo_name = repo.split('/', 1)
          folders = sorted(
              [d for d in os.listdir('.') if re.match(r'^\d{4}-\d{2}-\d{2}$', d)],
              reverse=True
          )
          latest = folders[0] if folders else ''
          link = f'https://{owner.lower()}.github.io/{repo_name}/{latest}/' if latest else ''

          # 교체 등 일부 항목이 실패한 채로 나머지만 커밋된 경우, curate.yml이 커밋
          # 메시지에 "(일부 실패: ...)"를 남겨둔다. 그걸 무시하고 무조건 "완료"로
          # 알리면 실패가 조용히 묻히므로, 여기서 감지해 제목·색을 바꿔 알린다.
          partial_fail_match = re.search(r'\(일부 실패: (.+)\)$', commit_msg)
          if partial_fail_match:
              title = f"⚠️ {label} 일부 실패"
              desc = f"실패: {partial_fail_match.group(1)}\n나머지는 반영됐어요. 다이제스트에서 확인해 주세요."
              header_style = "red"
          else:
              title = f"✅ {label} 완료"
              desc = '방금 만든 다이제스트를 확인해 보세요.'
              header_style = "blue"

          # Block Kit: header + 설명 + CTA 버튼 (다이제스트 페이지로 이동)
          payload = {
              "text": f"{title}\n👉 {link}",  # blocks 미지원 시 text fallback
              "blocks": [
                  {"type": "header", "text": title, "style": header_style},
                  {"type": "text", "text": desc},
                  {
                      "type": "button",
                      "text": "다이제스트 보기 →",
                      "style": "default",
                      "action_type": "open_system_browser",
                      "value": link,
                  },
              ],
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              webhook, data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  status, body = resp.status, resp.read().decode("utf-8", errors="replace")
          except urllib.error.HTTPError as e:
              print(f"[HTTPError] {e.code} {e.reason} body={e.read().decode('utf-8', errors='replace')}")
              raise
          # 카웍은 메시지를 거부해도 HTTP 200 을 준다. 정상 응답은 {"code": "ok"}.
          # status 만 보면 실패가 통째로 묻히므로 body 로 판정한다.
          print(f"[RESULT] status={status} body={body}")
          if not kw_accepted(body):
              print("[ERROR] 카웍이 메시지를 거부했습니다 — 봇/웹훅 URL 상태 확인 필요")
              raise SystemExit(1)
          print("[OK] 알림 발사 완료")
          PYEOF

  # 콘텐츠 워크플로우 실패 → 실패 알림 (Actions 로그 링크로 디버깅 유도)
  notify-on-content-failure:
    if: |
      !contains(github.event.workflow_run.name, 'pages') &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Send KakaoWork notification (failure)
        env:
          KAKAOWORK_WEBHOOK_URL: ${{ secrets.KAKAOWORK_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error

          def kw_accepted(body):
              """카웍 webhook 수락 여부. 정상 응답은 {"code": "ok"} (실측 2026-07-27)."""
              try:
                  parsed = json.loads(body or '{}')
              except json.JSONDecodeError:
                  return False
              return parsed.get('code') == 'ok' or parsed.get('success') is True

          webhook = os.environ.get('KAKAOWORK_WEBHOOK_URL', '').strip()
          if not webhook:
              print("[ERROR] KAKAOWORK_WEBHOOK_URL secret 비어있음")
              raise SystemExit(1)

          name = os.environ.get('WORKFLOW_NAME', '')
          run_url = os.environ.get('WORKFLOW_URL', '')

          labels = {
              '트렌드림 기사 큐레이션': '기사 큐레이션',
              '트렌드림 AI 명령 실행': 'AI 명령 실행',
              'Agit 게시': 'Agit 발행',
          }
          label = labels.get(name, name)

          # Block Kit: header + 설명 + CTA 버튼 (Actions 로그로 이동)
          title = f"❌ {label} 실패"
          desc = '워크플로우 로그를 확인해 주세요.'
          payload = {
              "text": f"{title}\n👉 {run_url}",  # blocks 미지원 시 text fallback
              "blocks": [
                  {"type": "header", "text": title, "style": "red"},
                  {"type": "text", "text": desc},
                  {
                      "type": "button",
                      "text": "로그 보기 →",
                      "style": "default",
                      "action_type": "open_system_browser",
                      "value": run_url,
                  },
              ],
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              webhook, data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  status, body = resp.status, resp.read().decode("utf-8", errors="replace")
          except urllib.error.HTTPError as e:
              print(f"[HTTPError] {e.code} {e.reason} body={e.read().decode('utf-8', errors='replace')}")
              raise
          # 카웍은 메시지를 거부해도 HTTP 200 을 준다. 정상 응답은 {"code": "ok"}.
          # status 만 보면 실패가 통째로 묻히므로 body 로 판정한다.
          print(f"[RESULT] status={status} body={body}")
          if not kw_accepted(body):
              print("[ERROR] 카웍이 메시지를 거부했습니다 — 봇/웹훅 URL 상태 확인 필요")
              raise SystemExit(1)
          print("[OK] 알림 발사 완료")
          PYEOF
