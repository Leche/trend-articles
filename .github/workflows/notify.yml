name: Notify Digest

# 두 경로로 알림 발사:
#  (A) workflow_run completed — 큐레이션·AI 명령·발행 워크플로우의 성공·실패
#  (B) main push — trigger.html 이 contents API 로 직접 commit 한 액션
#      (썸네일 교체 🖼️ / 기사 순서 조정 🔀 / 링크 수정 🔗).
#      trend-bot 의 자동 commit 은 (A) 에서 이미 처리되므로 (B) 에서는 제외.
on:
  workflow_run:
    workflows:
      - 트렌드림 기사 큐레이션
      - 트렌드림 AI 명령 실행
      - Agit 게시
    types:
      - completed
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    # 성공·실패만 알림. 'cancelled' / 'skipped' 는 사용자 의도와 무관한 경우가 많아 생략.
    if: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Send KakaoWork notification
        env:
          KAKAOWORK_WEBHOOK_URL: ${{ secrets.KAKAOWORK_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, subprocess, urllib.request, urllib.error

          webhook = os.environ.get('KAKAOWORK_WEBHOOK_URL', '').strip()
          if not webhook:
              print("[ERROR] KAKAOWORK_WEBHOOK_URL secret 비어있음")
              raise SystemExit(1)

          name = os.environ.get('WORKFLOW_NAME', '').strip()
          conclusion = os.environ.get('WORKFLOW_CONCLUSION', '').strip()
          run_url = os.environ.get('WORKFLOW_URL', '').strip()
          repo = os.environ.get('GITHUB_REPOSITORY', 'Leche/trend-articles')
          owner, repo_name = repo.split('/', 1)

          # 가장 최신 YYYY-MM-DD 폴더 = 작업 대상 다이제스트
          folders = sorted(
              [d for d in os.listdir('.') if re.match(r'^\d{4}-\d{2}-\d{2}$', d)],
              reverse=True
          )
          latest_folder = folders[0] if folders else ''
          digest_link = f'https://{owner.lower()}.github.io/{repo_name}/{latest_folder}/' if latest_folder else ''

          # 워크플로우 이름 기반 기본 라벨
          base_labels = {
              '트렌드림 기사 큐레이션': '기사 큐레이션',
              '트렌드림 AI 명령 실행': 'AI 명령 실행',
              'Agit 게시': 'Agit 발행',
          }
          action_label = base_labels.get(name, name)

          # 큐레이션 워크플로우는 여러 액션(큐레이션·교체·썸네일·순서·링크)을 한 yml 에서
          # 처리하므로, 워크플로우가 직접 만든 commit(=trend-bot author) 메시지로 세부 라벨을
          # 보강한다. head_sha 의 commit 을 그대로 보면, 워크플로우 트리거 시점의 main HEAD
          # 가 무관한 코드 commit 인 경우 메시지가 잘못 매칭됨.
          if name == '트렌드림 기사 큐레이션':
              try:
                  commit_msg = subprocess.check_output(
                      ['git', 'log', '-1', '--author=trend-bot', '--pretty=%s']
                  ).decode('utf-8').strip()
              except Exception:
                  commit_msg = ''
              if commit_msg.startswith('🔀'):
                  action_label = '기사 순서 조정'
              elif commit_msg.startswith('🖼️'):
                  action_label = '썸네일 교체'
              elif commit_msg.startswith('🔗'):
                  action_label = '링크 수정'
              elif commit_msg.startswith('🔄'):
                  action_label = '기사 교체'

          icon = '✅' if conclusion == 'success' else '❌'
          verb = '완료' if conclusion == 'success' else '실패'
          # 성공 → 다이제스트 페이지 / 실패 → 디버깅용 Actions 로그
          link = digest_link if (conclusion == 'success' and digest_link) else run_url
          text = f"{icon} {action_label} {verb}\n{link}"

          data = json.dumps({"text": text}).encode("utf-8")
          req = urllib.request.Request(
              webhook, data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"[OK] status={resp.status}")
          except urllib.error.HTTPError as e:
              print(f"[HTTPError] {e.code} {e.reason} body={e.read().decode('utf-8', errors='replace')}")
              raise
          PYEOF

  notify-direct-push:
    runs-on: ubuntu-latest
    # trigger.html 이 contents API 로 직접 만든 액션 commit 만 잡는다.
    # trend-bot 의 자동 commit (큐레이션·발행 등) 은 위 notify 잡에서 처리되므로 제외.
    # startsWith 로 검사 — 본문에 이모지가 들어간 다른 commit (예: fix 설명) 이 잘못
    # 매칭되지 않도록 commit 메시지 첫 글자만 본다.
    if: |
      github.event_name == 'push' &&
      github.event.head_commit.author.name != 'trend-bot' &&
      (startsWith(github.event.head_commit.message, '🖼️') ||
       startsWith(github.event.head_commit.message, '🔀') ||
       startsWith(github.event.head_commit.message, '🔗'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send KakaoWork notification (direct commit)
        env:
          KAKAOWORK_WEBHOOK_URL: ${{ secrets.KAKAOWORK_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, urllib.request, urllib.error

          webhook = os.environ.get('KAKAOWORK_WEBHOOK_URL', '').strip()
          if not webhook:
              print("[ERROR] KAKAOWORK_WEBHOOK_URL secret 비어있음")
              raise SystemExit(1)

          msg = os.environ.get('COMMIT_MSG', '')
          commit_url = os.environ.get('COMMIT_URL', '')
          repo = os.environ.get('GITHUB_REPOSITORY', 'Leche/trend-articles')
          owner, repo_name = repo.split('/', 1)

          # 가장 최신 YYYY-MM-DD 폴더 = 작업 대상 다이제스트
          folders = sorted(
              [d for d in os.listdir('.') if re.match(r'^\d{4}-\d{2}-\d{2}$', d)],
              reverse=True
          )
          latest_folder = folders[0] if folders else ''
          digest_link = f'https://{owner.lower()}.github.io/{repo_name}/{latest_folder}/' if latest_folder else commit_url

          # commit message 첫 글자(이모지)로 라벨 결정. 본문에 이모지가 있어도 무시.
          if msg.startswith('🖼️'):
              label = '썸네일 교체'
          elif msg.startswith('🔀'):
              label = '기사 순서 조정'
          elif msg.startswith('🔗'):
              label = '링크 수정'
          else:
              label = '업데이트'

          text = f"✅ {label} 완료\n{digest_link}"
          data = json.dumps({"text": text}).encode("utf-8")
          req = urllib.request.Request(
              webhook, data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"[OK] status={resp.status}")
          except urllib.error.HTTPError as e:
              print(f"[HTTPError] {e.code} {e.reason} body={e.read().decode('utf-8', errors='replace')}")
              raise
          PYEOF
