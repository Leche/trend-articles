name: Notify Digest

# 큐레이션·AI 명령·발행 워크플로우가 끝났을 때 작업 완료 알림 + 다이제스트 템플릿을
# KakaoWork로 전송. (이전엔 pages-build-deployment 완료에 트리거했는데, 그건 trigger.html
# 같은 코드 푸시에도 발사돼서 카웍에 잘못된 알림이 나가는 문제가 있었음.)
on:
  workflow_run:
    workflows:
      - 트렌드림 기사 큐레이션
      - 트렌드림 AI 명령 실행
      - Agit 게시
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    # 성공·실패만 알림. 'cancelled' / 'skipped' 는 사용자 의도와 무관한 경우가 많아 생략.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Send KakaoWork notification
        env:
          KAKAOWORK_WEBHOOK_URL: ${{ secrets.KAKAOWORK_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 << 'PYEOF'
          import os, json, subprocess, urllib.request, urllib.error

          webhook = os.environ.get('KAKAOWORK_WEBHOOK_URL', '').strip()
          if not webhook:
              print("[ERROR] KAKAOWORK_WEBHOOK_URL secret 비어있음")
              raise SystemExit(1)

          name = os.environ.get('WORKFLOW_NAME', '').strip()
          conclusion = os.environ.get('WORKFLOW_CONCLUSION', '').strip()
          run_url = os.environ.get('WORKFLOW_URL', '').strip()

          # 워크플로우 이름 기반 기본 라벨
          base_labels = {
              '트렌드림 기사 큐레이션': '기사 큐레이션',
              '트렌드림 AI 명령 실행': 'AI 명령 실행',
              'Agit 게시': 'Agit 발행',
          }
          action_label = base_labels.get(name, name)

          # 큐레이션 워크플로우는 여러 액션(큐레이션·교체·썸네일·순서·링크)을 한 yml 에서
          # 처리하므로, 직전 커밋 메시지로 세부 라벨을 보강한다.
          if name == '트렌드림 기사 큐레이션':
              try:
                  commit_msg = subprocess.check_output(
                      ['git', 'log', '-1', '--pretty=%s']
                  ).decode('utf-8').strip()
              except Exception:
                  commit_msg = ''
              if '🔀' in commit_msg or '순서 조정' in commit_msg:
                  action_label = '기사 순서 조정'
              elif '🖼️' in commit_msg or '썸네일' in commit_msg:
                  action_label = '썸네일 교체'
              elif '🔗' in commit_msg or '링크 수정' in commit_msg:
                  action_label = '링크 수정'
              elif '교체' in commit_msg:
                  action_label = '기사 교체'

          icon = '✅' if conclusion == 'success' else '❌'
          verb = '완료' if conclusion == 'success' else '실패'
          text = f"{icon} {action_label} {verb}\n{run_url}"

          data = json.dumps({"text": text}).encode("utf-8")
          req = urllib.request.Request(
              webhook, data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"[OK] status={resp.status}")
          except urllib.error.HTTPError as e:
              print(f"[HTTPError] {e.code} {e.reason} body={e.read().decode('utf-8', errors='replace')}")
              raise
          PYEOF
