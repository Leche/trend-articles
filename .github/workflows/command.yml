name: 트렌드림 AI 명령 실행

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '실행할 명령 (자연어)'
        required: true
      target_date:
        description: '대상 날짜 (YYYY-MM-DD, 비워두면 오늘 KST)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests beautifulsoup4 lxml

      # 모델 호출 경로 — curate.yml 과 동일. cli 면 Claude Code + 팀플랜 토큰 (API 과금 없음, 2026-10-13)
      - name: Resolve LLM backend
        id: backend
        env:
          VAR_BACKEND: ${{ vars.LLM_BACKEND || '' }}
        run: |
          B="${VAR_BACKEND:-api}"
          echo "backend=${B}" >> "$GITHUB_OUTPUT"
          echo "LLM backend: ${B}"

      - name: Install Claude Code (cli backend)
        if: steps.backend.outputs.backend == 'cli'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run command script
        env:
          LLM_BACKEND: ${{ steps.backend.outputs.backend }}
          # ⚠️ `cond && '' || secret` 삼항은 빈 문자열이 거짓이라 시크릿으로 떨어진다(2026-10-13 과금 사고).
          #    키는 다른 이름으로 받아 api 모드일 때만 bash 에서 export 한다. cli 모드 자식 프로세스는 llm.py 가 키를 지운다.
          API_KEY_FOR_API_MODE: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          COMMAND_PROMPT: ${{ github.event.inputs.prompt }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: |
          if [ "${LLM_BACKEND}" = "api" ]; then export ANTHROPIC_API_KEY="${API_KEY_FOR_API_MODE}"; fi
          unset API_KEY_FOR_API_MODE
          python scripts/command.py

      - name: Commit and push
        id: push
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "변경 없음" && echo "pushed=false" >> $GITHUB_OUTPUT && exit 0
          git commit -m "🤖 ${{ github.event.inputs.prompt }}"
          git pull --rebase
          git push
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Trigger GitHub Pages deployment
        if: steps.push.outputs.pushed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds

