name: 트렌드림 AI 명령 실행

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '실행할 명령 (자연어)'
        required: true
      target_date:
        description: '대상 날짜 (YYYY-MM-DD, 비워두면 오늘 KST)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run command script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMMAND_PROMPT: ${{ github.event.inputs.prompt }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: python scripts/command.py

      - name: Commit and push
        id: push
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "변경 없음" && echo "pushed=false" >> $GITHUB_OUTPUT && exit 0
          git commit -m "🤖 ${{ github.event.inputs.prompt }}"
          git pull --rebase
          git push
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Trigger GitHub Pages deployment
        if: steps.push.outputs.pushed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds

      - name: Notify KakaoWork
        if: success()
        env:
          KAKAOWORK_WEBHOOK_URL: ${{ secrets.KAKAOWORK_WEBHOOK_URL }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
          COMMAND_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, datetime, urllib.request, urllib.error

          webhook = os.environ.get('KAKAOWORK_WEBHOOK_URL', '').strip()
          target  = os.environ.get('TARGET_DATE', '').strip()
          prompt  = os.environ.get('COMMAND_PROMPT', '').strip()

          if target:
              d = datetime.datetime.strptime(target, '%Y-%m-%d').date()
          else:
              d = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          date_full = d.strftime('%Y-%m-%d')

          weekdays_ko = ['월요일','화요일','수요일','목요일','금요일','토요일','일요일']
          weekday_ko = weekdays_ko[d.weekday()]
          date_label = f"{d.year}. {d.month:02d}. {d.day:02d} {weekday_ko}"

          html_path = f'{date_full}/index.html'
          link = f'https://leche.github.io/trend-articles/{date_full}/'

          if not os.path.exists(html_path):
              print(f"[WARN] HTML not found at {html_path} — fallback 메시지만 전송")
              titles = []
          else:
              with open(html_path, 'r', encoding='utf-8') as f:
                  html = f.read()
              titles = [t.strip() for t in re.findall(r'class="article-title"[^>]*>([^<]+)', html)]
              print(f"[INFO] {len(titles)}개 기사 제목 추출")

          if titles:
              quote_block = "\n>\n".join(f"> *{i}. {t}*" for i, t in enumerate(titles, 1))
              message = (
                  f"🤖 AI 명령 실행 완료: {prompt}\n\n"
                  f"# ⚡️\n"
                  f"# [{date_label} 트렌드림 다이제스트]({link})\n"
                  f"{quote_block}\n"
                  f"cc. @@moretab @@pfs.design @@trenddaily"
              )
          else:
              message = (
                  f"🤖 AI 명령 실행 완료: {prompt}\n\n"
                  f"# ⚡️\n"
                  f"# [{date_label} 트렌드림 다이제스트]({link})\n"
                  f"cc. @@moretab @@pfs.design @@trenddaily"
              )

          if not webhook:
              print("[ERROR] KAKAOWORK_WEBHOOK_URL secret 이 비어있음")
              raise SystemExit(1)

          data = json.dumps({"text": message}).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"[OK] status={resp.status} body={resp.read().decode('utf-8')}")
          except urllib.error.HTTPError as e:
              print(f"[HTTPError] {e.code} {e.reason} body={e.read().decode('utf-8', errors='replace')}")
              raise
          PYEOF

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.KAKAOWORK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"❌ 명령 실행 실패\n\n📝 ${{ github.event.inputs.prompt }}\n로그를 확인해주세요.\"}"
