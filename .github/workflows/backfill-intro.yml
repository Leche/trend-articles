name: 다이제스트 인트로 일괄 생성 (백필)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run backfill (AI 인트로 생성 + 삽입)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/backfill_intro.py

      - name: Re-inject GNB (idempotent)
        run: python scripts/inject_gnb.py

      - name: Commit and push
        id: push
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && echo "pushed=false" >> $GITHUB_OUTPUT && exit 0
          git commit -m "✨ 과거 다이제스트 AI 인트로 일괄 생성"
          git pull --rebase
          git push
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Trigger GitHub Pages deployment
        if: steps.push.outputs.pushed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
