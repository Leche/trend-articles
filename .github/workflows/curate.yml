name: 트렌드림 기사 큐레이션

on:
  # 평일 오전 9시 KST 무렵 자동 실행 (UTC 23:50 일~목 = KST 08:50 월~금)
  # 정시(UTC 00:00)는 전 세계 cron이 몰려 지연/누락이 잦아 의도적으로 비정시 분으로 분산.
  # 워크플로우 자체에 ~5분 소요되므로 08:50 시작 → 9시경 결과 도착.
  # 한국 공휴일은 guard 잡에서 자동 skip
  schedule:
    - cron: '50 23 * * 0-4'
  # 수동 실행 (폰에서 trigger.html 또는 GitHub Actions → Run workflow)
  workflow_dispatch:
    inputs:
      article_count:
        description: '기사 개수 (기본 6개)'
        required: false
        default: '6'
      custom_date:
        description: '날짜 지정 (YYYY-MM-DD, 비워두면 오늘)'
        required: false
        default: ''
      replace_urls:
        description: '교체할 기사 URL (쉼표로 구분, 예: 1=https://...,3=https://...)'
        required: false
        default: ''
      test_mode:
        description: '테스트 모드 (true이면 test/ 폴더에만 저장, 실 데이터 보호)'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check workday (skip Korean holidays on cron)
        id: check
        run: |
          # 수동 실행은 항상 진행
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "수동 실행 — 진행"
            exit 0
          fi
          # cron path: 한국 공휴일 체크
          pip install --quiet holidays
          python << 'PYEOF' >> $GITHUB_OUTPUT
          import datetime, holidays
          d = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          kr = holidays.KR(years=d.year)
          if d in kr:
              print(f"should_run=false")
              import sys
              print(f"오늘 ({d}) 은 한국 공휴일: {kr[d]} — 큐레이션 건너뜀", file=sys.stderr)
          else:
              print(f"should_run=true")
              import sys
              print(f"오늘 ({d}) 은 평일 — 큐레이션 진행", file=sys.stderr)
          PYEOF

  curate:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 (과거 기사 크로스체크용)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests beautifulsoup4 lxml Pillow playwright

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run curation script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLE_COUNT: ${{ github.event.inputs.article_count || '6' }}
          CUSTOM_DATE: ${{ github.event.inputs.custom_date || '' }}
          REPLACE_URLS: ${{ github.event.inputs.replace_urls || '' }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python scripts/curate.py

      - name: Inject GNB into generated HTML
        run: python scripts/inject_gnb.py

      - name: Commit and push
        id: push
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          DATE_LABEL=$(python -c "
          import os, datetime
          cd = os.environ.get('CUSTOM_DATE','')
          d = datetime.datetime.strptime(cd,'%Y-%m-%d').date() if cd else datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          print(d.strftime('%y%m%d'))
          ")
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && echo "pushed=false" >> $GITHUB_OUTPUT && exit 0
          git commit -m "✨ ${DATE_LABEL} 트렌드림 기사 큐레이션"
          git pull --rebase
          git push
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Trigger GitHub Pages deployment
        if: steps.push.outputs.pushed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.KAKAOWORK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"❌ 큐레이션 워크플로우 실패\n로그를 확인해주세요.\"}"
