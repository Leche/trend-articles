name: 트렌드림 기사 큐레이션

on:
  # 평일 KST 08:50 첫 시도 후 15분 간격으로 KST 11:35까지 재시도 (최대 12회).
  # guard 잡이 당일 폴더 존재 여부를 매번 체크해, 한 번 성공하면 후속 트리거는
  # 자동으로 skip된다 → 사실상 "성공 시 멈춤" 동작.
  # 한국 공휴일은 guard 잡에서 자동 skip.
  schedule:
    - cron: '50 23 * * 0-4'            # KST 월~금 08:50 (1차)
    - cron: '5,20,35,50 0,1 * * 1-5'   # KST 월~금 09:05 ~ 10:50 (15분 간격)
    - cron: '5,20,35 2 * * 1-5'        # KST 월~금 11:05 ~ 11:35 (마지막 3회)
  # 수동 실행 (폰에서 trigger.html 또는 GitHub Actions → Run workflow)
  workflow_dispatch:
    inputs:
      article_count:
        description: '기사 개수 (기본 6개)'
        required: false
        default: '6'
      custom_date:
        description: '날짜 지정 (YYYY-MM-DD, 비워두면 오늘)'
        required: false
        default: ''
      replace_urls:
        description: '교체할 기사 URL (쉼표로 구분, 예: 1=https://...,3=https://...)'
        required: false
        default: ''
      test_mode:
        description: '테스트 모드 (true이면 test/ 폴더에만 저장, 실 데이터 보호)'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write

# 15분 간격 재시도 중 이전 인스턴스가 아직 실행 중일 수 있어, 한 번에 하나만
# 실행되도록 직렬화. cancel-in-progress=false → 진행 중인 큐레이션은 살리고
# 다음 트리거는 큐로 들어가며, 큐된 트리거는 차례가 오면 dedup guard에서 skip된다.
concurrency:
  group: curate
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Check workday + dedup
        id: check
        run: |
          # 수동 실행은 항상 진행
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "수동 실행 — 진행"
            exit 0
          fi
          # cron path: 한국 공휴일 + 중복 실행 방지
          pip install --quiet holidays
          python << 'PYEOF' >> $GITHUB_OUTPUT
          import datetime, holidays, os, sys
          d = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          kr = holidays.KR(years=d.year)
          if d in kr:
              print("should_run=false")
              print(f"오늘 ({d}) 은 한국 공휴일: {kr[d]} — 큐레이션 건너뜀", file=sys.stderr)
              raise SystemExit
          # 1차(08:50)가 이미 성공해서 폴더가 있으면 백업(10:00) cron은 skip
          if os.path.isdir(d.strftime('%Y-%m-%d')):
              print("should_run=false")
              print(f"오늘 ({d}) 큐레이션 이미 완료 — 백업 cron skip", file=sys.stderr)
              raise SystemExit
          print("should_run=true")
          print(f"오늘 ({d}) 은 평일 — 큐레이션 진행", file=sys.stderr)
          PYEOF

  curate:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 (과거 기사 크로스체크용)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests beautifulsoup4 lxml Pillow playwright

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run curation script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLE_COUNT: ${{ github.event.inputs.article_count || '6' }}
          CUSTOM_DATE: ${{ github.event.inputs.custom_date || '' }}
          REPLACE_URLS: ${{ github.event.inputs.replace_urls || '' }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python scripts/curate.py

      - name: Inject GNB into generated HTML
        run: python scripts/inject_gnb.py

      - name: Commit and push
        id: push
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          DATE_LABEL=$(python -c "
          import os, datetime
          cd = os.environ.get('CUSTOM_DATE','')
          d = datetime.datetime.strptime(cd,'%Y-%m-%d').date() if cd else datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          print(d.strftime('%y%m%d'))
          ")
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && echo "pushed=false" >> $GITHUB_OUTPUT && exit 0
          git commit -m "✨ ${DATE_LABEL} 트렌드림 기사 큐레이션"
          git pull --rebase
          git push
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Trigger GitHub Pages deployment
        if: steps.push.outputs.pushed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.KAKAOWORK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"❌ 큐레이션 워크플로우 실패\n로그를 확인해주세요.\"}"
