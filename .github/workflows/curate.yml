name: 트렌드림 기사 큐레이션

on:
  # 수동 실행만 (폰에서 GitHub Actions → Run workflow)
  workflow_dispatch:
    inputs:
      article_count:
        description: '기사 개수 (기본 6개)'
        required: false
        default: '6'
      custom_date:
        description: '날짜 지정 (YYYY-MM-DD, 비워두면 오늘)'
        required: false
        default: ''
      replace_urls:
        description: '교체할 기사 URL (쉼표로 구분, 예: 1=https://...,3=https://...)'
        required: false
        default: ''
      test_mode:
        description: '테스트 모드 (true이면 test/ 폴더에만 저장, 실 데이터 보호)'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 (과거 기사 크로스체크용)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests beautifulsoup4 lxml Pillow playwright

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run curation script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLE_COUNT: ${{ github.event.inputs.article_count || '6' }}
          CUSTOM_DATE: ${{ github.event.inputs.custom_date || '' }}
          REPLACE_URLS: ${{ github.event.inputs.replace_urls || '' }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python scripts/curate.py

      - name: Inject GNB into generated HTML
        run: python scripts/inject_gnb.py

      - name: Commit and push
        id: push
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          DATE_LABEL=$(python -c "
          import os, datetime
          cd = os.environ.get('CUSTOM_DATE','')
          d = datetime.datetime.strptime(cd,'%Y-%m-%d').date() if cd else datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          print(d.strftime('%y%m%d'))
          ")
          DATE_FULL=$(python -c "
          import os, datetime
          cd = os.environ.get('CUSTOM_DATE','')
          d = datetime.datetime.strptime(cd,'%Y-%m-%d').date() if cd else datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          print(d.strftime('%Y-%m-%d'))
          ")
          echo "DATE_FULL=${DATE_FULL}" >> $GITHUB_ENV
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && echo "pushed=false" >> $GITHUB_OUTPUT && exit 0
          git commit -m "✨ ${DATE_LABEL} 트렌드림 기사 큐레이션"
          git pull --rebase
          git push
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Trigger GitHub Pages deployment
        if: steps.push.outputs.pushed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds

      - name: Notify KakaoWork
        if: success()
        env:
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          KAKAOWORK_WEBHOOK_URL: ${{ secrets.KAKAOWORK_WEBHOOK_URL }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, datetime, urllib.request, urllib.error

          test_mode = os.environ.get('TEST_MODE', '').strip().lower() == 'true'
          webhook = os.environ.get('KAKAOWORK_WEBHOOK_URL', '').strip()
          date_full = os.environ.get('DATE_FULL', '').strip()

          if not date_full:
              d = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
              date_full = d.strftime('%Y-%m-%d')

          d = datetime.datetime.strptime(date_full, '%Y-%m-%d').date()
          weekdays_ko = ['월요일','화요일','수요일','목요일','금요일','토요일','일요일']
          weekday_ko = weekdays_ko[d.weekday()]
          date_label = f"{d.year}. {d.month:02d}. {d.day:02d} {weekday_ko}"

          html_path = 'test/index.html' if test_mode else f'{date_full}/index.html'
          link = 'https://leche.github.io/trend-articles/test/' if test_mode else f'https://leche.github.io/trend-articles/{date_full}/'

          if not os.path.exists(html_path):
              print(f"[WARN] HTML not found at {html_path} — fallback 메시지만 전송")
              titles = []
          else:
              with open(html_path, 'r', encoding='utf-8') as f:
                  html = f.read()
              titles = [t.strip() for t in re.findall(r'class="article-title"[^>]*>([^<]+)', html)]
              print(f"[INFO] {len(titles)}개 기사 제목 추출")

          test_prefix = "[TEST] " if test_mode else ""

          if titles:
              quote_block = "\n>\n".join(f"> *{i}. {t}*" for i, t in enumerate(titles, 1))
              message = (
                  f"# ⚡️\n"
                  f"# [{test_prefix}{date_label} 트렌드림 다이제스트]({link})\n"
                  f"{quote_block}\n"
                  f"cc. @@moretab @@pfs.design @@trenddaily"
              )
          else:
              message = (
                  f"# ⚡️\n"
                  f"# [{test_prefix}{date_label} 트렌드림 다이제스트]({link})\n"
                  f"cc. @@moretab @@pfs.design @@trenddaily"
              )

          if not webhook:
              print("[ERROR] KAKAOWORK_WEBHOOK_URL secret 이 비어있음")
              raise SystemExit(1)

          data = json.dumps({"text": message}).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"[OK] status={resp.status} body={resp.read().decode('utf-8')}")
          except urllib.error.HTTPError as e:
              print(f"[HTTPError] {e.code} {e.reason} body={e.read().decode('utf-8', errors='replace')}")
              raise
          PYEOF
