name: 트렌드림 기사 큐레이션

on:
  # GitHub Actions schedule은 인덱싱이 비결정적이라 신뢰 불가 →
  # 외부 cron(cron-job.org 등)이 workflow_dispatch를 호출하는 구조로 운영.
  # guard 잡의 한국 공휴일·중복 실행 체크는 외부 cron 사용 시에도 보호 장치로 유지.
  workflow_dispatch:
    inputs:
      article_count:
        description: '기사 개수 (기본 8개)'
        required: false
        default: '8'
      custom_date:
        description: '날짜 지정 (YYYY-MM-DD, 비워두면 오늘)'
        required: false
        default: ''
      replace_urls:
        description: '교체할 기사 URL (쉼표로 구분, 예: 1=https://...,3=https://...)'
        required: false
        default: ''
      test_mode:
        description: '테스트 모드 (true이면 test/ 폴더에만 저장, 실 데이터 보호)'
        required: false
        default: 'false'
      for_tomorrow:
        description: '저녁 큐레이션 — 다음날 발행용 다이제스트 (true/false)'
        required: false
        default: 'false'
      force_run:
        description: '강제 실행 (true면 공휴일·중복 체크 무시 — trigger.html 수동 실행용)'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write

# 외부 cron 자동 호출과 수동 실행이 겹칠 때를 대비해 한 번에 하나만 실행되도록 직렬화.
# cancel-in-progress=false → 진행 중인 큐레이션은 살리고 다음 트리거는 큐로 들어가며,
# 큐된 트리거는 차례가 오면 guard의 중복 체크에서 skip된다.
concurrency:
  group: curate
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Check workday + dedup
        id: check
        env:
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
          FOR_TOMORROW: ${{ github.event.inputs.for_tomorrow || 'false' }}
        run: |
          # force_run=true 면 가드 우회 (trigger.html 수동 실행)
          if [ "${FORCE_RUN,,}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "force_run=true — 가드 우회"
            exit 0
          fi
          # cron 경로: 한국 공휴일 + 중복 실행 방지. for_tomorrow=true 면 '내일 KST' 기준.
          pip install --quiet holidays
          python << 'PYEOF' >> $GITHUB_OUTPUT
          import datetime, holidays, os, sys
          for_tomorrow = os.environ.get('FOR_TOMORROW','').lower() == 'true'
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          target = now + datetime.timedelta(days=1) if for_tomorrow else now
          label = "내일" if for_tomorrow else "오늘"
          kr = holidays.KR(years=target.year)
          if target in kr:
              print("should_run=false")
              print(f"{label} ({target}) 은 한국 공휴일: {kr[target]} — 큐레이션 건너뜀", file=sys.stderr)
              raise SystemExit
          if os.path.isdir(target.strftime('%Y-%m-%d')):
              print("should_run=false")
              print(f"{label} ({target}) 큐레이션 이미 완료 — 중복 cron skip", file=sys.stderr)
              raise SystemExit
          print("should_run=true")
          print(f"{label} ({target}) 은 평일 — 큐레이션 진행", file=sys.stderr)
          PYEOF

  curate:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 (과거 기사 크로스체크용)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests beautifulsoup4 lxml Pillow playwright

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run curation script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLE_COUNT: ${{ github.event.inputs.article_count || '8' }}
          CUSTOM_DATE: ${{ github.event.inputs.custom_date || '' }}
          REPLACE_URLS: ${{ github.event.inputs.replace_urls || '' }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          FOR_TOMORROW: ${{ github.event.inputs.for_tomorrow || 'false' }}
        run: python scripts/curate.py

      - name: Inject GNB into generated HTML
        run: python scripts/inject_gnb.py

      - name: Commit and push
        id: push
        env:
          CUSTOM_DATE: ${{ github.event.inputs.custom_date || '' }}
          FOR_TOMORROW: ${{ github.event.inputs.for_tomorrow || 'false' }}
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          DATE_LABEL=$(python -c "
          import os, datetime
          cd = os.environ.get('CUSTOM_DATE','')
          ft = os.environ.get('FOR_TOMORROW','').lower() == 'true'
          if cd:
              d = datetime.datetime.strptime(cd,'%Y-%m-%d').date()
          else:
              base = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
              d = base + datetime.timedelta(days=1) if ft else base
          print(d.strftime('%y%m%d'))
          ")
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && echo "pushed=false" >> $GITHUB_OUTPUT && exit 0
          git commit -m "✨ ${DATE_LABEL} 트렌드림 기사 큐레이션"
          git pull --rebase
          git push
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Trigger GitHub Pages deployment
        if: steps.push.outputs.pushed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.KAKAOWORK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"❌ 큐레이션 워크플로우 실패\n로그를 확인해주세요.\"}"
