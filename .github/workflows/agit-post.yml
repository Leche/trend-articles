name: Agit 게시

# 검토 끝난 후 trigger.html에서 발화 → 13:30 KST에 Agit 그룹 wall에 자동 게시
# (skip_wait=true 면 즉시 게시)
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '대상 날짜 (YYYY-MM-DD, 비워두면 오늘 KST)'
        required: false
        default: ''
      skip_wait:
        description: '대기 없이 즉시 게시 (true/false)'
        required: false
        default: 'false'
      test_mode:
        description: '테스트 모드 — 개인 아지트로 POST (true/false)'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate digest data
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: |
          python3 << 'PYEOF'
          import os, re, datetime, sys

          target = os.environ.get('TARGET_DATE', '').strip()
          if target:
              d = datetime.datetime.strptime(target, '%Y-%m-%d').date()
          else:
              d = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          html_path = f"{d.strftime('%Y-%m-%d')}/index.html"

          if not os.path.exists(html_path):
              print(f"[ERROR] HTML 파일 없음: {html_path}")
              sys.exit(1)

          with open(html_path, 'r', encoding='utf-8') as f:
              html = f.read()

          titles = [t.strip() for t in re.findall(r'class="article-title"[^>]*>([^<]+)', html)]
          if not titles:
              print("[ERROR] 기사 제목 추출 실패")
              sys.exit(1)

          intro_section_exists = re.search(r'<section[^>]*data-static-intro', html)
          intro_match = re.search(
              r'<section[^>]*data-static-intro[^>]*>.*?<p class="digest-summary">([^<]+)</p>.*?</section>',
              html, re.DOTALL
          )
          if intro_section_exists and not intro_match:
              print("[ERROR] intro section은 있는데 digest-summary 추출 실패 — 정규식·구조 점검 필요")
              sys.exit(1)

          print(f"[OK] 검증 통과: 기사 {len(titles)}개, intro {'있음' if intro_match else '없음'}")
          PYEOF

      - name: Wait until 13:30 KST
        if: github.event.inputs.skip_wait != 'true'
        run: |
          python << 'PYEOF'
          import datetime, time, sys
          kst = datetime.timezone(datetime.timedelta(hours=9))
          now = datetime.datetime.now(kst)
          target = now.replace(hour=13, minute=30, second=0, microsecond=0)
          if now >= target:
              print(f"이미 13:30 KST 지남 ({now.strftime('%H:%M')}) — 즉시 게시")
              sys.exit(0)
          wait_sec = (target - now).total_seconds()
          # GitHub Actions 6시간 한도 안전 버퍼: 5h 45m 초과시 거부
          if wait_sec > 5 * 3600 + 45 * 60:
              print(f"::error::대기 시간 {wait_sec/60:.0f}분 — 6시간 한도 초과 우려. 8시 이후 다시 시도하거나 skip_wait=true 사용.")
              sys.exit(1)
          print(f"13:30 KST 까지 대기: {wait_sec/60:.1f}분")
          time.sleep(wait_sec)
          print(f"대기 완료. 게시 시작.")
          PYEOF

      - name: Post digest to Agit
        env:
          AGIT_WEBHOOK_URL: ${{ secrets.AGIT_WEBHOOK_URL }}
          AGIT_TEST_WEBHOOK_URL: ${{ secrets.AGIT_TEST_WEBHOOK_URL }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, datetime, urllib.request, urllib.error

          test_mode = os.environ.get('TEST_MODE', '').strip().lower() == 'true'
          if test_mode:
              webhook = os.environ.get('AGIT_TEST_WEBHOOK_URL', '').strip()
              if not webhook:
                  print("[ERROR] AGIT_TEST_WEBHOOK_URL secret 비어있음 (테스트 모드)")
                  raise SystemExit(1)
              print("[INFO] 🧪 테스트 모드 — 개인 아지트로 POST")
          else:
              webhook = os.environ.get('AGIT_WEBHOOK_URL', '').strip()
              if not webhook:
                  print("[ERROR] AGIT_WEBHOOK_URL secret 비어있음")
                  raise SystemExit(1)

          target = os.environ.get('TARGET_DATE', '').strip()
          if target:
              d = datetime.datetime.strptime(target, '%Y-%m-%d').date()
          else:
              d = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          date_full = d.strftime('%Y-%m-%d')

          weekdays_ko = ['월요일','화요일','수요일','목요일','금요일','토요일','일요일']
          date_label = f"{d.year}. {d.month:02d}. {d.day:02d} {weekdays_ko[d.weekday()]}"
          link = f'https://leche.github.io/trend-articles/{date_full}/'

          html_path = f'{date_full}/index.html'
          if not os.path.exists(html_path):
              print(f"[ERROR] HTML 파일 없음: {html_path}")
              raise SystemExit(1)

          with open(html_path, 'r', encoding='utf-8') as f:
              html = f.read()
          titles = [t.strip() for t in re.findall(r'class="article-title"[^>]*>([^<]+)', html)]
          if not titles:
              print("[ERROR] 기사 제목 추출 실패")
              raise SystemExit(1)

          # 인트로 요약 추출 — 반드시 정적 intro section 안의 것만 매칭.
          # (런타임 JS 코드에 같은 셀렉터 리터럴이 들어있어 단순 매칭 시 더미 텍스트 잡힘)
          intro_match = re.search(
              r'<section[^>]*data-static-intro[^>]*>.*?<p class="digest-summary">([^<]+)</p>.*?</section>',
              html, re.DOTALL
          )
          intro_text = intro_match.group(1).strip() if intro_match else ""

          # 각 기사 제목을 다이제스트 페이지의 앵커 링크로 연결
          quote_block = "\n>\n".join(
              f"> *{i}. [{t}]({link}#article-{i})*" for i, t in enumerate(titles, 1)
          )

          parts = [
              f"# ⚡️",
              f"# [{date_label} 트렌드림 다이제스트]({link})",
          ]
          if intro_text:
              parts.extend(["", intro_text])
          parts.extend(["", quote_block])
          # 테스트 모드(개인 아지트)에서는 단체 멘션 제거
          if not test_mode:
              parts.append(f"cc. @@moretab @@pfs.design @@trenddaily")
          message = "\n".join(parts)

          data = json.dumps({"text": message, "expire_type": "P5Y"}).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  body = resp.read().decode('utf-8')
                  print(f"[INFO] HTTP {resp.status} body={body}")
                  result = json.loads(body)
                  if result.get("status") != "ok":
                      print(f"[ERROR] Agit 응답 비정상: {body}")
                      raise SystemExit(1)
                  print(f"[OK] Agit 글 ID: {result.get('id')}")
          except urllib.error.HTTPError as e:
              print(f"[HTTPError] {e.code} {e.reason} body={e.read().decode('utf-8', errors='replace')}")
              raise

          PYEOF

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.KAKAOWORK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"❌ Agit 게시 실패\n로그를 확인해주세요.\"}"
