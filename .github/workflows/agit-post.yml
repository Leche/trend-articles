name: Agit 게시

# 발행 경로 두 가지:
#  (A) 외부 cron이 09:30 KST에 input 없이 호출 → pending-publish.json 확인 후 발행
#  (B) trigger.html "즉시 게시" / "테스트 게시" → skip_wait=true 로 호출 → pending 무시하고 바로 발행
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '대상 날짜 (YYYY-MM-DD, 비워두면 오늘 KST). skip_wait=true 일 때만 사용.'
        required: false
        default: ''
      skip_wait:
        description: '대기·예약 무시하고 즉시 게시 (true/false)'
        required: false
        default: 'false'
      test_mode:
        description: '테스트 모드 — 개인 아지트로 POST (true/false). skip_wait=true 일 때만 사용.'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve publish params
        id: params
        env:
          SKIP_WAIT: ${{ github.event.inputs.skip_wait || 'false' }}
          INPUT_TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
          INPUT_TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: |
          python3 << 'PYEOF'
          import os, json, datetime, pathlib

          skip_wait = os.environ.get('SKIP_WAIT', '').lower() == 'true'
          kst = datetime.timezone(datetime.timedelta(hours=9))
          today = datetime.datetime.now(kst).date()
          today_s = today.strftime('%Y-%m-%d')

          # 후속 스텝(skip 알림 / stale 자동 정리)에서 참조하기 위한 기본값
          pending_date = ''
          is_stale = False

          if skip_wait:
              # 즉시 게시 경로 — input 값 사용. pending 무시.
              target_date = os.environ.get('INPUT_TARGET_DATE', '').strip() or today_s
              test_mode = os.environ.get('INPUT_TEST_MODE', 'false').strip().lower()
              skip = 'false'
              source = 'workflow_dispatch(skip_wait)'
          else:
              # 예약 게시 경로 — pending-publish.json 읽어서 결정.
              p = pathlib.Path('pending-publish.json')
              if not p.exists():
                  print("[INFO] pending-publish.json 없음 → 발행 skip (예약된 발행 없음)")
                  skip, target_date, test_mode, source = 'true', '', 'false', 'no_pending'
              else:
                  try:
                      data = json.loads(p.read_text(encoding='utf-8') or '{}')
                  except json.JSONDecodeError:
                      print("[WARN] pending-publish.json 파싱 실패 → skip")
                      data = {}
                  pending_date = (data.get('date') or '').strip()
                  if not pending_date:
                      print("[INFO] pending-publish.json 비어있음 → skip")
                      skip, target_date, test_mode, source = 'true', '', 'false', 'empty_pending'
                  elif pending_date != today_s:
                      # 문자열 사전 비교(YYYY-MM-DD)로 stale(과거) 여부 판정
                      is_stale = pending_date < today_s
                      print(f"[WARN] pending date({pending_date}) ≠ 오늘 KST({today_s}) → skip (stale={is_stale})")
                      skip, target_date, test_mode, source = 'true', '', 'false', 'date_mismatch'
                  else:
                      target_date = pending_date
                      test_mode = str(data.get('test_mode', False)).lower()
                      skip = 'false'
                      source = 'pending'
                      print(f"[OK] pending 발행 예약 매칭 — date={target_date} test_mode={test_mode}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"skip={skip}\n")
              f.write(f"target_date={target_date}\n")
              f.write(f"test_mode={test_mode}\n")
              f.write(f"source={source}\n")
              f.write(f"today_s={today_s}\n")
              f.write(f"pending_date={pending_date}\n")
              f.write(f"is_stale={'true' if is_stale else 'false'}\n")
          PYEOF

      - name: Notify skip (date_mismatch)
        if: steps.params.outputs.source == 'date_mismatch'
        run: |
          curl -X POST "${{ secrets.KAKAOWORK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg pending "${{ steps.params.outputs.pending_date }}" \
              --arg today "${{ steps.params.outputs.today_s }}" \
              --arg stale "${{ steps.params.outputs.is_stale }}" \
              '{text: ("⚠️ Agit 자동 발행 SKIP — date_mismatch\n예약 날짜: " + $pending + "\n오늘 KST: " + $today + "\nstale(과거 예약): " + $stale + "\n\n과거 예약이면 자동 정리됩니다. 미래 예약이면 해당 날짜 09:30에 다시 시도합니다.")}')"

      - name: Auto-clear stale pending
        if: steps.params.outputs.source == 'date_mismatch' && steps.params.outputs.is_stale == 'true'
        env:
          PENDING_DATE: ${{ steps.params.outputs.pending_date }}
          TODAY_KST: ${{ steps.params.outputs.today_s }}
        run: |
          echo '{}' > pending-publish.json
          if [ -z "$(git status --porcelain pending-publish.json 2>/dev/null)" ]; then
            echo "pending-publish.json 변경 없음 (이미 비어있음)"
            exit 0
          fi
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add pending-publish.json
          git commit -m "chore(publish): stale pending-publish.json 자동 정리 (date=${PENDING_DATE}, today=${TODAY_KST})"
          git pull --rebase
          git push

      - name: Validate digest data
        if: steps.params.outputs.skip != 'true'
        env:
          TARGET_DATE: ${{ steps.params.outputs.target_date }}
        run: |
          python3 << 'PYEOF'
          import os, re, datetime, sys

          target = os.environ.get('TARGET_DATE', '').strip()
          if target:
              d = datetime.datetime.strptime(target, '%Y-%m-%d').date()
          else:
              d = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          html_path = f"{d.strftime('%Y-%m-%d')}/index.html"

          if not os.path.exists(html_path):
              print(f"[ERROR] HTML 파일 없음: {html_path}")
              sys.exit(1)

          with open(html_path, 'r', encoding='utf-8') as f:
              html = f.read()

          titles = [t.strip() for t in re.findall(r'class="article-title"[^>]*>([^<]+)', html)]
          if not titles:
              print("[ERROR] 기사 제목 추출 실패")
              sys.exit(1)

          intro_section_exists = re.search(r'<section[^>]*data-static-intro', html)
          intro_match = re.search(
              r'<section[^>]*data-static-intro[^>]*>.*?<p class="digest-summary">([^<]+)</p>.*?</section>',
              html, re.DOTALL
          )
          if intro_section_exists and not intro_match:
              print("[ERROR] intro section은 있는데 digest-summary 추출 실패 — 정규식·구조 점검 필요")
              sys.exit(1)

          print(f"[OK] 검증 통과: 기사 {len(titles)}개, intro {'있음' if intro_match else '없음'}")
          PYEOF

      - name: Post digest to Agit
        if: steps.params.outputs.skip != 'true'
        env:
          AGIT_WEBHOOK_URL: ${{ secrets.AGIT_WEBHOOK_URL }}
          AGIT_TEST_WEBHOOK_URL: ${{ secrets.AGIT_TEST_WEBHOOK_URL }}
          KAKAOWORK_WEBHOOK_URL: ${{ secrets.KAKAOWORK_WEBHOOK_URL }}
          TARGET_DATE: ${{ steps.params.outputs.target_date }}
          TEST_MODE: ${{ steps.params.outputs.test_mode }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, datetime, urllib.request, urllib.error

          test_mode = os.environ.get('TEST_MODE', '').strip().lower() == 'true'
          if test_mode:
              webhook = os.environ.get('AGIT_TEST_WEBHOOK_URL', '').strip()
              if not webhook:
                  print("[ERROR] AGIT_TEST_WEBHOOK_URL secret 비어있음 (테스트 모드)")
                  raise SystemExit(1)
              print("[INFO] 🧪 테스트 모드 — 개인 아지트로 POST")
          else:
              webhook = os.environ.get('AGIT_WEBHOOK_URL', '').strip()
              if not webhook:
                  print("[ERROR] AGIT_WEBHOOK_URL secret 비어있음")
                  raise SystemExit(1)

          target = os.environ.get('TARGET_DATE', '').strip()
          if target:
              d = datetime.datetime.strptime(target, '%Y-%m-%d').date()
          else:
              d = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          date_full = d.strftime('%Y-%m-%d')

          weekdays_ko = ['월요일','화요일','수요일','목요일','금요일','토요일','일요일']
          date_label = f"{d.year}. {d.month:02d}. {d.day:02d} {weekdays_ko[d.weekday()]}"
          link = f'https://leche.github.io/trend-articles/{date_full}/'

          html_path = f'{date_full}/index.html'
          if not os.path.exists(html_path):
              print(f"[ERROR] HTML 파일 없음: {html_path}")
              raise SystemExit(1)

          with open(html_path, 'r', encoding='utf-8') as f:
              html = f.read()
          titles = [t.strip() for t in re.findall(r'class="article-title"[^>]*>([^<]+)', html)]
          if not titles:
              print("[ERROR] 기사 제목 추출 실패")
              raise SystemExit(1)

          # 인트로 요약 추출 — 반드시 정적 intro section 안의 것만 매칭.
          # (런타임 JS 코드에 같은 셀렉터 리터럴이 들어있어 단순 매칭 시 더미 텍스트 잡힘)
          intro_match = re.search(
              r'<section[^>]*data-static-intro[^>]*>.*?<p class="digest-summary">([^<]+)</p>.*?</section>',
              html, re.DOTALL
          )
          intro_text = intro_match.group(1).strip() if intro_match else ""

          # 각 기사 제목을 다이제스트 페이지의 앵커 링크로 연결
          quote_block = "\n>\n".join(
              f"> *{i}. [{t}]({link}#article-{i})*" for i, t in enumerate(titles, 1)
          )

          parts = [
              f"# ⚡️",
              f"# [{date_label} 트렌드림 다이제스트]({link})",
          ]
          if intro_text:
              parts.extend(["", intro_text])
          parts.extend(["", quote_block])
          # 테스트 모드(개인 아지트)에서는 단체 멘션 제거
          if not test_mode:
              parts.append(f"cc. @@moretab @@onboarding.design @@trenddaily")
          message = "\n".join(parts)

          data = json.dumps({"text": message, "expire_type": "P5Y"}).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  body = resp.read().decode('utf-8')
                  print(f"[INFO] HTTP {resp.status} body={body}")
                  result = json.loads(body)
                  if result.get("status") != "ok":
                      print(f"[ERROR] Agit 응답 비정상: {body}")
                      raise SystemExit(1)
                  print(f"[OK] Agit 글 ID: {result.get('id')}")
          except urllib.error.HTTPError as e:
              print(f"[HTTPError] {e.code} {e.reason} body={e.read().decode('utf-8', errors='replace')}")
              raise

          # ── 카카오워크 발행 완료 알림 (CTA 버튼 포함) ────────────────
          kw_webhook = os.environ.get('KAKAOWORK_WEBHOOK_URL', '').strip()
          if kw_webhook:
              # Agit 응답에서 thread URL 추출 시도 (응답 필드명 불확실 → 가능한 키 순회)
              thread_url = (
                  result.get('url')
                  or result.get('permalink')
                  or result.get('link')
                  or result.get('post_url')
                  or ''
              )
              # 못 찾으면 다이제스트 페이지로 fallback
              if not thread_url:
                  thread_url = link

              test_prefix = '🧪 ' if test_mode else ''
              title = f'{test_prefix}Agit 발행 완료'
              desc = (
                  f'{date_label} 다이제스트가 '
                  f'{"개인 아지트(테스트)" if test_mode else "트렌드림 아지트"}에 올라갔어요.'
              )

              payload = {
                  "text": f"✅ {title}\n👉 {thread_url}",  # blocks 미지원 시 text fallback
                  "blocks": [
                      {"type": "header", "text": title, "style": "blue"},
                      {"type": "text", "text": desc},
                      {
                          "type": "button",
                          "text": "스레드 보기 →",
                          "style": "default",
                          "action_type": "open_system_browser",
                          "value": thread_url,
                      },
                  ],
              }
              notify_req = urllib.request.Request(
                  kw_webhook,
                  data=json.dumps(payload).encode('utf-8'),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(notify_req, timeout=10) as notify_resp:
                      print(f"[OK] 카웍 알림 발사: status={notify_resp.status}")
              except Exception as e:
                  # 알림 실패해도 발행 자체는 성공 → 워크플로우는 통과
                  print(f"[WARN] 카웍 알림 발사 실패: {e}")
          else:
              print("[INFO] KAKAOWORK_WEBHOOK_URL 비어있음 — 카웍 알림 생략")

          PYEOF

      - name: Clear pending-publish.json
        if: success() && steps.params.outputs.skip != 'true'
        env:
          PUBLISHED_DATE: ${{ steps.params.outputs.target_date }}
        run: |
          # 방금 발행한 날짜와 pending.date가 일치할 때만 비운다.
          # (즉시 게시했는데 미래 날짜 발행 예약이 있던 경우, 그 예약은 보존)
          # python heredoc 안의 sys.exit 은 부모 bash 를 끊지 못하므로,
          # 변경 여부는 그 뒤 git status --porcelain 으로 다시 판단한다.
          python3 << 'PYEOF'
          import json, os, pathlib, sys
          published = os.environ.get('PUBLISHED_DATE','').strip()
          p = pathlib.Path('pending-publish.json')
          if not p.exists():
              print("pending-publish.json 없음 — 비울 것도 없음")
              sys.exit(0)
          try:
              data = json.loads(p.read_text(encoding='utf-8') or '{}')
          except json.JSONDecodeError:
              data = {}
          pending_date = (data.get('date') or '').strip()
          if pending_date and pending_date != published:
              print(f"pending.date({pending_date}) ≠ 발행({published}) — 보존")
              sys.exit(0)
          p.write_text(json.dumps({}, ensure_ascii=False) + "\n", encoding='utf-8')
          PYEOF
          # 변경 사항이 없으면 (파일이 처음부터 없었거나, 보존 케이스) commit·push 생략.
          if [ -z "$(git status --porcelain pending-publish.json 2>/dev/null)" ]; then
            echo "pending-publish.json 변경 없음 (커밋 불필요)"
            exit 0
          fi
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add pending-publish.json
          # 발행 완료 알림은 Post digest step 에서 이미 발사했으므로, 여기 commit 메시지는
          # notify.yml 의 이모지 라벨링에 잡히지 않도록 일반 chore: 로 둔다.
          git commit -m "chore(publish): pending-publish.json 비우기 (${PUBLISHED_DATE} 발행 후)"
          git pull --rebase
          git push

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.KAKAOWORK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg target "${{ steps.params.outputs.target_date }}" \
              --arg source "${{ steps.params.outputs.source }}" \
              '{text: ("❌ Agit 자동 발행 워크플로우 실패\n대상 날짜: " + $target + "\nsource: " + $source + "\n\nGitHub Actions 로그를 확인해주세요.")}')"

