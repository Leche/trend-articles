name: 다이제스트 다음 영업일로 미루기

# 놀금·공휴일 등으로 오늘 발행을 건너뛰고 만들어둔 다이제스트를 다음 영업일로
# 재활용할 때 사용. 트리거 페이지의 "다음 영업일로 미루기" 버튼이 호출.
on:
  workflow_dispatch:
    inputs:
      source_date:
        description: '소스 날짜 (YYYY-MM-DD, 비워두면 최신 폴더 자동 감지)'
        required: false
        default: ''
      target_date:
        description: '타겟 날짜 (YYYY-MM-DD, 비워두면 소스 기준 다음 영업일 자동 계산)'
        required: false
        default: ''
      dry_run:
        description: '리허설 — 러너에서만 실제로 옮겨보고 커밋·발행예약·알림은 안 함 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write

jobs:
  repurpose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install holidays

      - name: Resolve and execute repurpose
        id: run
        env:
          SOURCE_DATE: ${{ github.event.inputs.source_date || '' }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          # 실패 알림에 원인을 실어 보내려고 출력을 파일에도 남긴다.
          # pipefail 없으면 tee 의 종료코드가 스텝 결과를 덮어써 실패가 성공으로 보인다.
          set -o pipefail
          python3 << 'PYEOF' 2>&1 | tee "$RUNNER_TEMP/repurpose.log"
          import os, re, json, datetime
          import holidays

          # ── 소스 날짜 해결 ─────────────────────────────────
          src = os.environ.get('SOURCE_DATE','').strip()
          if not src:
              dirs = sorted([d for d in os.listdir('.')
                             if re.match(r'^\d{4}-\d{2}-\d{2}$', d) and os.path.isdir(d)])
              if not dirs:
                  raise SystemExit("[ERROR] 큐레이션 폴더가 하나도 없음")
              src = dirs[-1]
          source_date = datetime.datetime.strptime(src, '%Y-%m-%d').date()
          print(f"[INFO] source_date = {source_date}")

          # ── 타겟 날짜 해결 — 주말 + KR 공휴일 + 놀금(마지막 주 금) skip ──
          tgt = os.environ.get('TARGET_DATE','').strip()
          if not tgt:
              kr_h = holidays.KR(years=[source_date.year, source_date.year + 1])
              d = source_date + datetime.timedelta(days=1)
              while True:
                  if d.weekday() >= 5:  # 주말
                      d += datetime.timedelta(days=1)
                      continue
                  if d in kr_h:  # 한국 공휴일
                      d += datetime.timedelta(days=1)
                      continue
                  # 놀금: 그 달의 마지막 금요일 (다음주 같은 요일이 다음 달이면 마지막 금요일)
                  if d.weekday() == 4 and (d + datetime.timedelta(days=7)).month != d.month:
                      d += datetime.timedelta(days=1)
                      continue
                  break
              target_date = d
          else:
              target_date = datetime.datetime.strptime(tgt, '%Y-%m-%d').date()
          print(f"[INFO] target_date = {target_date}")

          src_dir = source_date.strftime('%Y-%m-%d')
          tgt_dir = target_date.strftime('%Y-%m-%d')

          if not os.path.isdir(src_dir):
              raise SystemExit(f"[ERROR] 소스 폴더 없음: {src_dir}")
          if not os.path.isfile(f"{src_dir}/index.html"):
              raise SystemExit(f"[ERROR] 소스 폴더에 index.html 없음: {src_dir}")
          if os.path.exists(tgt_dir):
              raise SystemExit(f"[ERROR] 타겟 이미 존재: {tgt_dir} — 덮어쓰기 방지")

          # ── 폴더를 통째로 이동 ────────────────────────────
          # index.html 만 옮기면 썸네일(thumb-*.png/jpg/webp)이 소스 폴더에 남아
          # rmdir 이 "Directory not empty" 로 터진다. 아지트 발행도 {날짜}/{thumb}
          # 경로로 썸네일을 읽으므로 폴더 단위 rename 이 맞다.
          moved = sorted(os.listdir(src_dir))
          os.rename(src_dir, tgt_dir)
          tgt_html = f"{tgt_dir}/index.html"
          print(f"[OK] {src_dir}/ → {tgt_dir}/ 이동 ({len(moved)}개: {', '.join(moved)})")

          # ── title 라벨 교체 ──────────────────────────────
          weekdays_ko = ['월요일','화요일','수요일','목요일','금요일','토요일','일요일']
          src_label = f"{source_date.year}. {source_date.month}. {source_date.day} {weekdays_ko[source_date.weekday()]}"
          tgt_label = f"{target_date.year}. {target_date.month}. {target_date.day} {weekdays_ko[target_date.weekday()]}"
          src_title = f"<title>{src_label} Trend Article Digest</title>"
          tgt_title = f"<title>{tgt_label} Trend Article Digest</title>"

          with open(tgt_html, encoding='utf-8') as f:
              html = f.read()
          if src_title in html:
              html = html.replace(src_title, tgt_title)
              with open(tgt_html, 'w', encoding='utf-8') as f:
                  f.write(html)
              print(f"[OK] {tgt_html} title: {src_label} → {tgt_label}")
          else:
              print(f"[WARN] {tgt_html} 안에 예상 title 형식 없음 — title 건너뜀")

          # ── 루트 index.html 미러 동기화 (소스 title 가지고 있을 때만) ──
          root = 'index.html'
          if os.path.exists(root):
              with open(root, encoding='utf-8') as f:
                  root_html = f.read()
              if src_title in root_html:
                  root_html = root_html.replace(src_title, tgt_title)
                  with open(root, 'w', encoding='utf-8') as f:
                      f.write(root_html)
                  print(f"[OK] root index.html title 업데이트")
              else:
                  print(f"[INFO] root index.html 은 다른 날짜 미러 중 — 건드리지 않음")

          # ── pending-publish.json 박기 ─────────────────────
          now_iso = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z')
          pending = {
              "date": tgt_dir,
              "test_mode": False,
              "scheduled_at": now_iso,
          }
          with open('pending-publish.json', 'w', encoding='utf-8') as f:
              json.dump(pending, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(f"[OK] pending-publish.json: date={tgt_dir}")

          # ── 후속 스텝용 outputs ────────────────────────────
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"source_date={src_dir}\n")
              f.write(f"target_date={tgt_dir}\n")
              f.write(f"source_label={src_label}\n")
              f.write(f"target_label={tgt_label}\n")

          # ── 리허설 결과 리포트 ─────────────────────────────
          # 이 버튼은 놀금·공휴일에만 쓰는 비상구라 몇 달씩 안 쏴보게 된다.
          # (실제로 5/29 작성 후 7/30 첫 실행에서 처음 터졌다.)
          # dry_run 은 러너에서 진짜로 옮겨본 뒤 커밋만 안 하는 경로 —
          # 아무 날에나 눌러서 이 코드가 아직 도는지 확인할 수 있게 한다.
          report = [
              f"| 항목 | 값 |", "| --- | --- |",
              f"| 소스 | `{src_dir}/` ({src_label}) |",
              f"| 타겟 | `{tgt_dir}/` ({tgt_label}) |",
              f"| 옮겨진 파일 | {len(moved)}개 — {', '.join(moved)} |",
              f"| 타겟 폴더 실제 내용 | {', '.join(sorted(os.listdir(tgt_dir)))} |",
              f"| 발행 예약 | {tgt_dir} 09:30 KST |",
          ]
          dry = os.environ.get('DRY_RUN','').lower() == 'true'
          summary = ("## 🧪 리허설 (dry_run) — 커밋·발행예약·알림 없음\n\n"
                     if dry else "## 📦 재배치 실행\n\n") + "\n".join(report) + "\n"
          print(summary)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write(summary)
          if dry:
              print("[DRY RUN] 러너 작업트리에서만 반영됨 — 아래 커밋·Pages·알림 스텝은 모두 skip 됩니다.")
          PYEOF

      - name: Commit and push
        if: github.event.inputs.dry_run != 'true'
        env:
          SOURCE_DATE: ${{ steps.run.outputs.source_date }}
          TARGET_DATE: ${{ steps.run.outputs.target_date }}
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 종료"
            exit 0
          fi
          git commit -m "chore(digest): ${SOURCE_DATE} 다이제스트를 ${TARGET_DATE} 로 미루기"
          git pull --rebase
          git push

      - name: Trigger Pages
        if: github.event.inputs.dry_run != 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds

      - name: Notify success
        if: github.event.inputs.dry_run != 'true'
        run: |
          payload=$(jq -n \
            --arg src "${{ steps.run.outputs.source_label }}" \
            --arg tgt "${{ steps.run.outputs.target_label }}" \
            --arg date "${{ steps.run.outputs.target_date }}" \
            '{text: ("📦 다이제스트 재배치 완료\n" + $src + " → " + $tgt + "\n\n" + $date + " 09:30 KST 에 자동 발사돼요.")}')
          resp=$(curl -sS -X POST "${{ secrets.KAKAOWORK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" -d "$payload")
          # 카웍은 메시지를 거부해도 HTTP 200 을 준다. 정상 응답은 {"code": "ok"}.
          echo "[RESULT] body=$resp"
          [ "$(jq -r '.code // empty' <<< "$resp")" = "ok" ] || {
            echo "[ERROR] 카웍이 메시지를 거부했습니다 — 봇/웹훅 URL 상태 확인 필요"; exit 1; }

      - name: Notify failure
        if: failure()
        run: |
          # 원인 없는 "로그를 확인해주세요" 알림은 매번 수동 조사를 부른다 → 마지막 출력을 함께 보낸다.
          # 리허설 실패도 알린다 — 비상구가 썩었는지 알려주는 게 dry_run 의 존재 이유니까.
          reason=$(tail -c 400 "$RUNNER_TEMP/repurpose.log" 2>/dev/null || true)
          head='❌ 다이제스트 재배치 실패'
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && head='❌ 다이제스트 재배치 리허설 실패 (실제 발행엔 영향 없음)'
          payload=$(jq -n \
            --arg head "$head" \
            --arg reason "${reason:-(스크립트 실행 전 단계에서 실패 — 로그 없음)}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{text: ($head + "\n\n" + $reason + "\n\n" + $url)}')
          resp=$(curl -sS -X POST "${{ secrets.KAKAOWORK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" -d "$payload")
          # 카웍은 메시지를 거부해도 HTTP 200 을 준다. 정상 응답은 {"code": "ok"}.
          echo "[RESULT] body=$resp"
          [ "$(jq -r '.code // empty' <<< "$resp")" = "ok" ] || {
            echo "[ERROR] 실패 알림이 카웍에 거부됐습니다 — 봇/웹훅 URL 상태 확인 필요"; exit 1; }
